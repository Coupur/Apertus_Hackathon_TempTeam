services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ORIGIN: ${ORIGIN:?Set ORIGIN to the public HTTPS origin}
    restart: unless-stopped
    environment:
      ORIGIN: ${ORIGIN:?Set ORIGIN to the public HTTPS origin}
      RESEND_API_KEY: ${RESEND_API_KEY:?Set RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:?Set RESEND_FROM_EMAIL}
    expose:
      - "3000"
    volumes:
      - app-data:/app/.data

volumes:
  app-data:
